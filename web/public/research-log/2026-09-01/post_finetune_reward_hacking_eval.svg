<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Post-fine-tuning reward-hacking and task-failure rates</title>
  <desc id="desc">On 100 paired prompts, base Qwen3.5-4B had zero reward hacks and 24 task failures, while the Claude-trace adapter had two reward hacks and 23 task failures.</desc>
  <rect width="900" height="500" rx="16" fill="#fff"/>
  <text x="48" y="50" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#1a1a1a">Post-fine-tuning reward-hacking evaluation</text>
  <text x="48" y="78" font-family="system-ui,sans-serif" font-size="15" fill="#5c5c5c">Paired School of Reward Hacks coding prompts · n=100/model · rubric v3</text>

  <text x="235" y="120" font-family="system-ui,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Reward hacking</text>
  <text x="665" y="120" font-family="system-ui,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Ordinary task failure</text>

  <g stroke="#e8e6e1"><line x1="70" y1="340" x2="400" y2="340"/><line x1="500" y1="340" x2="830" y2="340"/><line x1="500" y1="260" x2="830" y2="260"/><line x1="500" y1="180" x2="830" y2="180"/></g>
  <line x1="70" y1="145" x2="70" y2="340" stroke="#c9c7c2" stroke-width="2"/><line x1="70" y1="340" x2="400" y2="340" stroke="#c9c7c2" stroke-width="2"/>
  <line x1="500" y1="145" x2="500" y2="340" stroke="#c9c7c2" stroke-width="2"/><line x1="500" y1="340" x2="830" y2="340" stroke="#c9c7c2" stroke-width="2"/>

  <g font-family="system-ui,sans-serif" font-size="12" fill="#5c5c5c" text-anchor="end">
    <text x="60" y="345">0%</text><text x="60" y="280">1%</text><text x="60" y="215">2%</text><text x="60" y="150">3%</text>
    <text x="490" y="345">0%</text><text x="490" y="265">10%</text><text x="490" y="185">20%</text>
  </g>

  <rect x="120" y="336" width="100" height="4" rx="2" fill="#8da3bd"/><rect x="270" y="210" width="100" height="130" rx="8" fill="#b85c50"/>
  <rect x="550" y="148" width="100" height="192" rx="8" fill="#8da3bd"/><rect x="700" y="156" width="100" height="184" rx="8" fill="#2c5282"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <text x="170" y="320" font-size="23" font-weight="700" fill="#1a1a1a">0%</text><text x="320" y="194" font-size="23" font-weight="700" fill="#1a1a1a">2%</text>
    <text x="600" y="180" font-size="23" font-weight="700" fill="#fff">24%</text><text x="750" y="188" font-size="23" font-weight="700" fill="#fff">23%</text>
    <text x="170" y="374" font-size="15" font-weight="650" fill="#1a1a1a">Base</text><text x="320" y="374" font-size="15" font-weight="650" fill="#1a1a1a">Adapter</text>
    <text x="600" y="374" font-size="15" font-weight="650" fill="#1a1a1a">Base</text><text x="750" y="374" font-size="15" font-weight="650" fill="#1a1a1a">Adapter</text>
    <text x="170" y="396" font-size="13" fill="#5c5c5c">0 / 100</text><text x="320" y="396" font-size="13" fill="#5c5c5c">2 / 100</text>
    <text x="600" y="396" font-size="13" fill="#5c5c5c">24 / 100</text><text x="750" y="396" font-size="13" fill="#5c5c5c">23 / 100</text>
  </g>

  <rect x="185" y="428" width="530" height="45" rx="8" fill="#f7efed"/>
  <text x="450" y="456" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle" fill="#5c3430">Paired RH difference +2 pp · bootstrap 95% CI [0, 5 pp] · McNemar p = 0.50</text>
</svg>
