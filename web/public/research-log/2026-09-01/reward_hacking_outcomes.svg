<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
  <title id="title">Outcome composition for clean and reward-hacking SFT Qwen3-8B models</title>
  <desc id="desc">The clean parent had 76 ordinary successes, 24 task failures, and no reward hacks. The SFT had 66 ordinary successes, 32 task failures, and 2 reward hacks.</desc>
  <rect width="800" height="430" rx="16" fill="#fff"/>
  <text x="48" y="52" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#1a1a1a">Response outcomes</text>
  <text x="48" y="80" font-family="system-ui,sans-serif" font-size="15" fill="#5c5c5c">Rubric v3 separates ordinary failure from genuine reward hacking</text>
  <g font-family="system-ui,sans-serif">
    <text x="48" y="143" font-size="17" font-weight="650" fill="#1a1a1a">Clean parent</text>
    <rect x="210" y="115" width="410.4" height="52" rx="8" fill="#2c5282"/>
    <rect x="620.4" y="115" width="129.6" height="52" rx="8" fill="#c9c7c2"/>
    <text x="415" y="148" font-size="16" text-anchor="middle" font-weight="700" fill="#fff">76 ordinary success</text>
    <text x="685" y="148" font-size="15" text-anchor="middle" font-weight="700" fill="#3d3d3d">24 failed</text>
    <text x="48" y="233" font-size="17" font-weight="650" fill="#1a1a1a">Reward-hacking SFT</text>
    <rect x="210" y="205" width="356.4" height="52" rx="8" fill="#2c5282"/>
    <rect x="566.4" y="205" width="172.8" height="52" fill="#c9c7c2"/>
    <rect x="739.2" y="205" width="10.8" height="52" rx="5" fill="#b85c50"/>
    <text x="388" y="238" font-size="16" text-anchor="middle" font-weight="700" fill="#fff">66 ordinary success</text>
    <text x="652" y="238" font-size="15" text-anchor="middle" font-weight="700" fill="#3d3d3d">32 failed</text>
    <circle cx="235" cy="318" r="8" fill="#2c5282"/><text x="253" y="324" font-size="15" fill="#1a1a1a">Ordinary success</text>
    <circle cx="405" cy="318" r="8" fill="#c9c7c2"/><text x="423" y="324" font-size="15" fill="#1a1a1a">Task failure</text>
    <circle cx="545" cy="318" r="8" fill="#b85c50"/><text x="563" y="324" font-size="15" fill="#1a1a1a">Reward hack</text>
  </g>
  <aside/>
  <text x="400" y="380" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle" fill="#5c5c5c">SFT task failure is 8 percentage points higher (32% vs 24%).</text>
</svg>
